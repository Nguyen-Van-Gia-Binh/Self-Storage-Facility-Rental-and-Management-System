server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: self-storage-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/selfstorage?sslmode=prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none} # Flyway quản lý schema; 'none' giúp khởi động app siêu nhanh ở local, có thể override = validate trên prod
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25 # Gom N+1 queries thành batch IN (?, ?, ...), giảm 80% RTT mạng

  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Google OAuth 2.0 Client ID
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Cấu hình JWT theo CONVENTIONS.md & API-SPEC.md
jwt:
  # Secret key tối thiểu 256-bit (32 bytes) cho HS256
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration-ms: 900000 # 15 phút (15 * 60 * 1000)
  refresh-token-expiration-ms: 604800000 # 7 ngày (7 * 24 * 60 * 60 * 1000)

# Swagger UI / OpenAPI docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

