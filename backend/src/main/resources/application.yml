server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: self-storage-backend

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SelfStorageDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourPassword123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate # Sử dụng Flyway để quản lý schema, không cho hibernate tự drop/create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Google OAuth 2.0 Client ID
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Cấu hình JWT theo CONVENTIONS.md & API-SPEC.md
jwt:
  # Secret key tối thiểu 256-bit (32 bytes) cho HS256
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration-ms: 900000     # 15 phút (15 * 60 * 1000)
  refresh-token-expiration-ms: 604800000 # 7 ngày (7 * 24 * 60 * 60 * 1000)

# Swagger UI / OpenAPI docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Cổng thanh toán Sandbox nội bộ (SmartStorage Integrated Payment Gateway) - SC-03
payment:
  sandbox:
    account-name: CONG TY CP SMARTSTORAGE VIETNAM
    account-number: "0888567999"
    bank-bin: "970422"
    bank-name: MB Bank (Ngân hàng Quân Đội)
    checkout-url: ${PAYMENT_CHECKOUT_URL:http://localhost:5173/payment/checkout}
    return-url: ${PAYMENT_RETURN_URL:http://localhost:5173/payment/success}
    cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:5173/payment/cancel}

