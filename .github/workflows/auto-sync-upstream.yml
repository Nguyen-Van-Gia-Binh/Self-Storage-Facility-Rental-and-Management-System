name: 🔄 Auto Sync Upstream Main

on:
  schedule:
    - cron: '*/4 * * * *'  # Tự động đồng bộ mỗi 4 phút một lần
  workflow_dispatch:        # Cho phép bấm nút "Run workflow" trên GitHub Actions tab để đồng bộ ngay lập tức

permissions:
  contents: write

jobs:
  sync-main:
    name: 📥 Sync with Upstream Repository
    # Chỉ chạy trên repo fork cá nhân (Tung-pro123), không chạy trên repo gốc của Bình
    if: github.repository != 'Nguyen-Van-Gia-Binh/Self-Storage-Facility-Rental-and-Management-System'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Reset Fork Main sang đúng trạng thái Upstream (No Bot Commit)
        run: |
          echo "1. Cấu hình remote upstream..."
          git remote add upstream https://github.com/Nguyen-Van-Gia-Binh/Self-Storage-Facility-Rental-and-Management-System.git || \
          git remote set-url upstream https://github.com/Nguyen-Van-Gia-Binh/Self-Storage-Facility-Rental-and-Management-System.git

          echo "2. Lấy toàn bộ lịch sử mới nhất từ repo gốc..."
          git fetch upstream main

          echo "3. Kiểm tra xem fork có đang trỏ đúng vào đầu upstream chưa..."
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          ORIGIN_HEAD=$(git rev-parse origin/main)

          if [ "$UPSTREAM_HEAD" = "$ORIGIN_HEAD" ]; then
            echo "✅ Fork đã đồng bộ 100% với upstream. Không có gì cần cập nhật."
            exit 0
          fi

          echo "🚀 Phát hiện commit mới từ upstream (${UPSTREAM_HEAD:0:7}), tiến hành đồng bộ..."

          # Reset HARD về đúng đầu upstream: không tạo commit bot mới
          # → Mọi commit hiển thị đều là commit gốc từ repo Bình, Verified đầy đủ
          git checkout main
          git reset --hard upstream/main

          echo "4. Đẩy lên origin main bằng force (vì đây là fork luôn đồng bộ từ 1 chiều)..."
          git push origin main --force

          echo "🎉 Đã đồng bộ thành công! Fork main khớp 100% với upstream main."
          echo "   Commit cuối: $(git log -1 --oneline)"
