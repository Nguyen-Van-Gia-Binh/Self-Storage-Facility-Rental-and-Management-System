name: PR Verification Bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    name: 🔍 Verify PR Compliance & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selfstorage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Check Branch Naming Convention (CONTRIBUTING.md § 2)
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Kiểm tra tên nhánh: $BRANCH_NAME"
          PATTERN="^(feature|feat|fix|hotfix|docs|chore|refactor|test|perf|ci|build)/((T[0-9]+\.[0-9]+|Tx|[a-zA-Z0-9]+)-)?[a-zA-Z0-9._/-]+$"
          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "::warning::⚠️ Tên nhánh '$BRANCH_NAME' chưa đúng định dạng khuyến nghị (<loại>/[<mã-task>-]<mô-tả>)."
          else
            echo "✅ Tên nhánh hợp lệ!"
          fi

      - name: 📝 Check PR Title Convention (CONTRIBUTING.md § 4.2)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Kiểm tra tiêu đề PR: $PR_TITLE"
          shopt -s nocasematch
          PATTERN="^(\[[^]]+\][[:space:]]*)?(feat|feature|fix|hotfix|docs|refactor|test|style|chore|build|ci|perf)(\([^)]+\))?:[[:space:]]*.+$"
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::warning::⚠️ Tiêu đề PR '$PR_TITLE' chưa đúng chuẩn Conventional Commits (<loại>(<phạm-vi>): <mô-tả>)."
          else
            echo "✅ Tiêu đề PR hợp lệ!"
          fi
          shopt -u nocasematch

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run Backend Tests (Spring Boot 3)
        working-directory: backend
        run: mvn clean test

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🎨 Run Frontend Build & Type Check (React Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

