<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <style>
    .lane-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #000000; }
    .act-desc { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #444444; }
    .edge-label { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; text-anchor: middle; }
    .edge-label-start { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; text-anchor: start; }
    .caption { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="900" height="650" fill="#ffffff" />
  <!-- Lanes -->
  
      <rect x="0" y="30" width="225" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="112.5" y="52" class="lane-title">Storage Customer</text>
    
      <rect x="225" y="30" width="225" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="337.5" y="52" class="lane-title">Facility Staff</text>
    
      <rect x="450" y="30" width="225" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="562.5" y="52" class="lane-title">Facility Manager</text>
    
      <rect x="675" y="30" width="225" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="787.5" y="52" class="lane-title">Finance Ledger System</text>
    
  
      <line x1="0" y1="30" x2="0" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="225" y1="30" x2="225" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="450" y1="30" x2="450" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="675" y1="30" x2="675" y2="605" stroke="#000000" stroke-width="1.2" />
    
    <line x1="900" y1="30" x2="900" y2="605" stroke="#000000" stroke-width="1.2" />
    <line x1="0" y1="605" x2="900" y2="605" stroke="#000000" stroke-width="1.2" />
  
  <!-- Diagram Elements -->
  
    <circle cx="112.5" cy="80" r="10" fill="#000000" />
    <path d="M 112.5 90 L 112.5 115" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <rect x="20" y="115" width="180" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="110" y="135" class="act-text">Schedule Return Date</text>
    <text x="110" y="150" class="act-desc">(Normal / Early Return)</text>

    <!-- To Staff Inspection -->
    <path d="M 200 137 L 245 137" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    <text x="210" y="130" class="edge-label">Check-out Day</text>

    <rect x="245" y="115" width="180" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="335" y="135" class="act-text">Exit Inspection &amp; Photos</text>
    <text x="335" y="150" class="act-desc">(Assess Damage &amp; Trash)</text>

    <!-- To Unit CLEANING -->
    <path d="M 335 160 L 335 200" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <rect x="245" y="200" width="180" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="335" y="220" class="act-text">Set Unit: CLEANING</text>
    <text x="335" y="235" class="act-desc">(BR-RET-09 Sanitization)</text>

    <!-- To FM Approval -->
    <path d="M 425 137 L 470 137" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    <text x="430" y="130" class="edge-label">Damage Protocol</text>

    <rect x="470" y="115" width="180" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="560" y="135" class="act-text">Review &amp; Approve Voucher</text>
    <text x="560" y="150" class="act-desc">(Net Balance Formula)</text>

    <!-- To Ledger System -->
    <path d="M 650 137 L 695 137" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    <text x="655" y="130" class="edge-label">Authorize</text>

    <rect x="695" y="115" width="180" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="785" y="135" class="act-text">Record Double-Entry Ledger</text>
    <text x="785" y="150" class="act-desc">(LedgerEntry Immutable)</text>

    <!-- Refund Disbursed to Customer -->
    <path d="M 785 160 L 785 290 L 110 290 L 110 320" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    <text x="450" y="280" class="edge-label">Disburse Net Refund (3-5 days)</text>

    <rect x="20" y="320" width="180" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="110" y="340" class="act-text">Receive Deposit Refund</text>
    <text x="110" y="355" class="act-desc">(Contract CLOSED)</text>

    <circle cx="110" cy="410" r="13" stroke="#000000" stroke-width="1.5" fill="#ffffff" />
    <circle cx="110" cy="410" r="7" fill="#000000" />
    <path d="M 110 365 L 110 397" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Figure Caption -->
  <text x="450" y="635" class="caption">Swimlane 3: Flow_3_Checkout_Return_And_Final_Settlement</text>
</svg>