  <rect x="667" y="635" width="184" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.1" />
  <text x="759" y="651" class="node-text" dominant-baseline="central">Review &amp; approve</text><text x="759" y="665" class="node-text" dominant-baseline="central">final settlement balance</text>
  <polygon points="464,712 527,744 464,776 401,744" fill="#ffffff" stroke="#000000" stroke-width="1.1" />
  <text x="464" y="737.5" class="node-text" dominant-baseline="central">Net refund</text><text x="464" y="750.5" class="node-text" dominant-baseline="central">&gt;= 0?</text>
  <rect x="91" y="720" width="176" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.1" />
  <text x="179" y="737" class="node-text" dominant-baseline="central">Pay settlement deficit</text><text x="179" y="751" class="node-text" dominant-baseline="central">via VNPay checkout</text>
  <rect x="368" y="808" width="192" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.1" />
  <text x="464" y="825" class="node-text" dominant-baseline="central">Close contract (CLOSED),</text><text x="464" y="839" class="node-text" dominant-baseline="central">record ledger &amp; refund</text>
  <rect x="665" y="808" width="188" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.1" />
  <text x="759" y="825" class="node-text" dominant-baseline="central">Finish unit sanitation</text><text x="759" y="839" class="node-text" dominant-baseline="central">(AVAILABLE / RESERVED)</text>
  <rect x="91" y="899" width="176" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.1" />
  <text x="179" y="915" class="node-text" dominant-baseline="central">Receive deposit refund</text><text x="179" y="929" class="node-text" dominant-baseline="central">(3-5 days) &amp; receipt</text>
