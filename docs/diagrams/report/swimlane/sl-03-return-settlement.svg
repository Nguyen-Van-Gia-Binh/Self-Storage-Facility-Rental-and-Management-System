<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760">
  <style>
    .lane-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-desc { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #555555; }
    .edge-label { font-family: Arial, sans-serif; font-size: 10.5px; fill: #000000; text-anchor: middle; }
    .caption { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="1040" height="760" fill="#ffffff" />
  <!-- Lanes -->
  
      <rect x="0" y="30" width="260" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="130" y="52" class="lane-title">Storage Customer</text>
    
      <rect x="260" y="30" width="260" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="390" y="52" class="lane-title">Facility Staff</text>
    
      <rect x="520" y="30" width="260" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="650" y="52" class="lane-title">Facility Manager</text>
    
      <rect x="780" y="30" width="260" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="910" y="52" class="lane-title">Finance Ledger System</text>
    
  
      <line x1="0" y1="30" x2="0" y2="715" stroke="#000000" stroke-width="1.2" />
    
      <line x1="260" y1="30" x2="260" y2="715" stroke="#000000" stroke-width="1.2" />
    
      <line x1="520" y1="30" x2="520" y2="715" stroke="#000000" stroke-width="1.2" />
    
      <line x1="780" y1="30" x2="780" y2="715" stroke="#000000" stroke-width="1.2" />
    
    <line x1="1040" y1="30" x2="1040" y2="715" stroke="#000000" stroke-width="1.2" />
    <line x1="0" y1="715" x2="1040" y2="715" stroke="#000000" stroke-width="1.2" />
  
  <!-- Diagram Elements -->
  
    <!-- Start -->
    <circle cx="130" cy="80" r="10" fill="#000000" />
    <path d="M 130 90 L 130 115" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <!-- 1. Customer: Schedule Return -->
    <rect x="30" y="115" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="130" y="140" class="act-title">1. Schedule Return Date</text>
    <text x="130" y="158" class="act-desc">(Normal or Win-Win Early Return)</text>

    <!-- To Staff Inspection -->
    <path d="M 230 145 L 390 145 L 390 200" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="247.5" y="132" width="125" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="310" y="146" class="edge-label">Check-out Request</text>
  

    <!-- 2. Staff: Exit Inspection -->
    <rect x="290" y="200" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="390" y="225" class="act-title">2. Exit Inspection &amp; Photos</text>
    <text x="390" y="243" class="act-desc">(Assess Damage, Trash &amp; Lock)</text>

    <!-- To Unit CLEANING -->
    <path d="M 390 260 L 390 315" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="330" y="273" width="120" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="390" y="287" class="edge-label">Inspection Logged</text>
  

    <!-- 3. Staff: Set CLEANING -->
    <rect x="290" y="315" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="390" y="340" class="act-title">3. Set Unit: CLEANING</text>
    <text x="390" y="358" class="act-desc">(Sanitization Queue, BR-RET-09)</text>

    <!-- To FM Approval -->
    <path d="M 490 345 L 650 345 L 650 400" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="510" y="332" width="120" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="570" y="346" class="edge-label">Damage Protocol</text>
  

    <!-- 4. FM: Approve Voucher -->
    <rect x="550" y="400" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="650" y="425" class="act-title">4. Review &amp; Approve Voucher</text>
    <text x="650" y="443" class="act-desc">(Net Settlement Formula)</text>

    <!-- To Ledger System -->
    <path d="M 750 430 L 910 430 L 910 485" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="772.5" y="417" width="115" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="830" y="431" class="edge-label">Authorize Ledger</text>
  

    <!-- 5. Ledger System: Double Entry -->
    <rect x="810" y="485" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="910" y="510" class="act-title">5. Record Double-Entry Ledger</text>
    <text x="910" y="528" class="act-desc">(LedgerEntry Immutable Audit)</text>

    <!-- Refund Disbursed to Customer -->
    <path d="M 810 515 L 130 515 L 130 570" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="375" y="502" width="190" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="470" y="516" class="edge-label">Disburse Net Refund (3-5 days)</text>
  

    <!-- 6. Customer: Receive Refund -->
    <rect x="30" y="570" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="130" y="595" class="act-title">6. Receive Deposit Refund</text>
    <text x="130" y="613" class="act-desc">(Contract CLOSED, Unit Available)</text>

    <!-- End -->
    <circle cx="130" cy="675" r="13" stroke="#000000" stroke-width="1.5" fill="#ffffff" />
    <circle cx="130" cy="675" r="7" fill="#000000" />
    <path d="M 130 630 L 130 662" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Figure Caption -->
  <text x="520" y="745" class="caption">Swimlane 3: Flow_3_Checkout_Return_And_Final_Settlement</text>
</svg>