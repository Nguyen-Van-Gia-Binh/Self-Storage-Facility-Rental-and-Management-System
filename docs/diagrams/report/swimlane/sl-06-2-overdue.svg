<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="850" height="650">
  <style>
    .lane-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #000000; }
    .act-desc { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #444444; }
    .edge-label { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; text-anchor: middle; }
    .edge-label-start { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; text-anchor: start; }
    .caption { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="850" height="650" fill="#ffffff" />
  <!-- Lanes -->
  
      <rect x="0" y="30" width="283.3333333333333" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="141.66666666666666" y="52" class="lane-title">System Schedulers (Cron)</text>
    
      <rect x="283.3333333333333" y="30" width="283.3333333333333" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="425" y="52" class="lane-title">Storage Customer</text>
    
      <rect x="566.6666666666666" y="30" width="283.3333333333333" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="708.3333333333333" y="52" class="lane-title">Staff & Central Warehouse</text>
    
  
      <line x1="0" y1="30" x2="0" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="283.3333333333333" y1="30" x2="283.3333333333333" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="566.6666666666666" y1="30" x2="566.6666666666666" y2="605" stroke="#000000" stroke-width="1.2" />
    
    <line x1="850" y1="30" x2="850" y2="605" stroke="#000000" stroke-width="1.2" />
    <line x1="0" y1="605" x2="850" y2="605" stroke="#000000" stroke-width="1.2" />
  
  <!-- Diagram Elements -->
  
    <circle cx="140" cy="80" r="10" fill="#000000" />
    <path d="M 140 90 L 140 115" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <rect x="40" y="115" width="200" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="135" class="act-text">Midnight Scan at Day D+1</text>
    <text x="140" y="150" class="act-desc">(Transition to OVERDUE)</text>

    <path d="M 140 160 L 140 200" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <rect x="40" y="200" width="200" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="220" class="act-text">Suspend Smart Lock PIN</text>
    <text x="140" y="235" class="act-desc">("No Pay, No PIN" BR-OVD-01)</text>

    <!-- Notify Customer -->
    <path d="M 240 222 L 323.3333333333333 222" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    <text x="280" y="215" class="edge-label">Alert SMS/Email</text>

    <rect x="323.3333333333333" y="200" width="200" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="423.3333333333333" y="220" class="act-text">Receive Daily Debt Notices</text>
    <text x="423.3333333333333" y="235" class="act-desc">(Grace D+1..D+3, Penalty D+4..D+6)</text>

    <!-- D+7 Eviction -->
    <path d="M 140 245 L 140 320" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <rect x="40" y="320" width="200" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="340" class="act-text">Day D+7: Terminate Contract</text>
    <text x="140" y="355" class="act-desc">(100% Deposit Liquidated)</text>

    <!-- Dispatch to Staff -->
    <path d="M 240 342 L 606.6666666666666 342" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    <text x="423.3333333333333" y="335" class="edge-label">Eviction Order</text>

    <rect x="606.6666666666666" y="320" width="200" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="706.6666666666666" y="340" class="act-text">Seal Unit &amp; Impound Goods</text>
    <text x="706.6666666666666" y="355" class="act-desc">(Transfer to Central Wh 30 days)</text>

    <!-- Unit Available D+8 -->
    <path d="M 706.6666666666666 365 L 706.6666666666666 420" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <rect x="606.6666666666666" y="420" width="200" height="45" rx="4" ry="4" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="706.6666666666666" y="440" class="act-text">Release Unit: AVAILABLE</text>
    <text x="706.6666666666666" y="455" class="act-desc">(Day D+8, Buffer: 8 days)</text>

    <circle cx="706.6666666666666" cy="510" r="13" stroke="#000000" stroke-width="1.5" fill="#ffffff" />
    <circle cx="706.6666666666666" cy="510" r="7" fill="#000000" />
    <path d="M 706.6666666666666 465 L 706.6666666666666 497" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Figure Caption -->
  <text x="425" y="635" class="caption">Swimlane 6.2: Flow_6_2_Overdue_Escalation_And_Eviction</text>
</svg>