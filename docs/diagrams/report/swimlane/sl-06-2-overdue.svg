<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 770" width="840" height="770">
  <style>
    .lane-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-desc { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #555555; }
    .edge-label { font-family: Arial, sans-serif; font-size: 10.5px; fill: #000000; text-anchor: middle; }
    .caption { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="840" height="770" fill="#ffffff" />
  <!-- Lanes -->
  
      <rect x="0" y="30" width="280" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="140" y="52" class="lane-title">System Schedulers (Cron)</text>
    
      <rect x="280" y="30" width="280" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="420" y="52" class="lane-title">Storage Customer</text>
    
      <rect x="560" y="30" width="280" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="700" y="52" class="lane-title">Staff &amp; Central Warehouse</text>
    
  
      <line x1="0" y1="30" x2="0" y2="725" stroke="#000000" stroke-width="1.2" />
    
      <line x1="280" y1="30" x2="280" y2="725" stroke="#000000" stroke-width="1.2" />
    
      <line x1="560" y1="30" x2="560" y2="725" stroke="#000000" stroke-width="1.2" />
    
    <line x1="840" y1="30" x2="840" y2="725" stroke="#000000" stroke-width="1.2" />
    <line x1="0" y1="725" x2="840" y2="725" stroke="#000000" stroke-width="1.2" />
  
  <!-- Diagram Elements -->
  
    <!-- Start -->
    <circle cx="140" cy="80" r="10" fill="#000000" />
    <path d="M 140 90 L 140 115" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <!-- 1. System: Midnight Scan -->
    <rect x="40" y="115" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="140" class="act-title">1. Midnight Scan at Day D+1</text>
    <text x="140" y="158" class="act-desc">(Transition to OVERDUE)</text>

    <!-- Vertical Link -->
    <path d="M 140 175 L 140 230" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="75" y="188" width="130" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="140" y="202" class="edge-label">Unpaid Past Maturity</text>
  

    <!-- 2. System: Suspend PIN -->
    <rect x="40" y="230" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="255" class="act-title">2. Suspend Smart Lock PIN</text>
    <text x="140" y="273" class="act-desc">("No Pay, No PIN" BR-OVD-01)</text>

    <!-- Notify Customer -->
    <path d="M 240 260 L 420 260 L 420 315" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="272.5" y="247" width="115" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="330" y="261" class="edge-label">Alert SMS / Email</text>
  

    <!-- 3. Customer: Receive Notices -->
    <rect x="320" y="315" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="420" y="340" class="act-title">3. Receive Daily Debt Notices</text>
    <text x="420" y="358" class="act-desc">(Grace D+1..3, Penalty D+4..6)</text>

    <!-- Back to System: D+7 Eviction -->
    <path d="M 320 345 L 140 345 L 140 400" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="157.5" y="332" width="145" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="230" y="346" class="edge-label">No Payment by Day D+7</text>
  

    <!-- 4. System: Terminate Contract -->
    <rect x="40" y="400" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="425" class="act-title">4. Day D+7: Terminate Contract</text>
    <text x="140" y="443" class="act-desc">(100% Deposit Liquidated)</text>

    <!-- Dispatch to Staff -->
    <path d="M 240 430 L 700 430 L 700 485" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="400" y="417" width="140" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="470" y="431" class="edge-label">Eviction Work Order</text>
  

    <!-- 5. Staff: Seal Unit -->
    <rect x="600" y="485" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="700" y="510" class="act-title">5. Seal Unit &amp; Impound Goods</text>
    <text x="700" y="528" class="act-desc">(Transfer to Central Wh 30 Days)</text>

    <!-- Vertical Link -->
    <path d="M 700 545 L 700 600" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="632.5" y="558" width="135" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="700" y="572" class="edge-label">Sanitization Complete</text>
  

    <!-- 6. Staff: Unit Available D+8 -->
    <rect x="600" y="600" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="700" y="625" class="act-title">6. Release Unit: AVAILABLE</text>
    <text x="700" y="643" class="act-desc">(Day D+8, Buffer: 8 Days)</text>

    <!-- End -->
    <circle cx="700" cy="705" r="13" stroke="#000000" stroke-width="1.5" fill="#ffffff" />
    <circle cx="700" cy="705" r="7" fill="#000000" />
    <path d="M 700 660 L 700 692" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Figure Caption -->
  <text x="420" y="755" class="caption">Swimlane 6.2: Flow_6_2_Overdue_Escalation_And_Eviction</text>
</svg>