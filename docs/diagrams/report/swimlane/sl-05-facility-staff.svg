<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 650" width="840" height="650">
  <style>
    .lane-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .act-desc { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #555555; }
    .edge-label { font-family: Arial, sans-serif; font-size: 10.5px; fill: #000000; text-anchor: middle; }
    .caption { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="840" height="650" fill="#ffffff" />
  <!-- Lanes -->
  
      <rect x="0" y="30" width="280" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="140" y="52" class="lane-title">Facility Manager (FM)</text>
    
      <rect x="280" y="30" width="280" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="420" y="52" class="lane-title">Shift Dispatcher</text>
    
      <rect x="560" y="30" width="280" height="35" stroke="#000000" stroke-width="1.5" fill="#f8f9fa" />
      <text x="700" y="52" class="lane-title">Facility Staff</text>
    
  
      <line x1="0" y1="30" x2="0" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="280" y1="30" x2="280" y2="605" stroke="#000000" stroke-width="1.2" />
    
      <line x1="560" y1="30" x2="560" y2="605" stroke="#000000" stroke-width="1.2" />
    
    <line x1="840" y1="30" x2="840" y2="605" stroke="#000000" stroke-width="1.2" />
    <line x1="0" y1="605" x2="840" y2="605" stroke="#000000" stroke-width="1.2" />
  
  <!-- Diagram Elements -->
  
    <!-- Start -->
    <circle cx="140" cy="80" r="10" fill="#000000" />
    <path d="M 140 90 L 140 115" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <!-- 1. FM: Configure Floorplan -->
    <rect x="40" y="115" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="140" class="act-title">1. Configure Floorplan Layout</text>
    <text x="140" y="158" class="act-desc">(Zone, Row, Unit Coordinates)</text>

    <!-- Vertical Link -->
    <path d="M 140 175 L 140 230" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="85" y="188" width="110" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="140" y="202" class="edge-label">Floorplan Saved</text>
  

    <!-- 2. FM: Weekly Shift Roster -->
    <rect x="40" y="230" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="140" y="255" class="act-title">2. Build Weekly Shift Roster</text>
    <text x="140" y="273" class="act-desc">(Morning &amp; Afternoon Shifts)</text>

    <!-- To Dispatcher -->
    <path d="M 240 260 L 420 260 L 420 315" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="275" y="247" width="110" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="330" y="261" class="edge-label">Publish Roster</text>
  

    <!-- 3. Dispatcher: Generate Daily Worklist -->
    <rect x="320" y="315" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="420" y="340" class="act-title">3. Generate Daily Worklist</text>
    <text x="420" y="358" class="act-desc">(Check-ins, Returns, Cleaning)</text>

    <!-- To Staff -->
    <path d="M 520 345 L 700 345 L 700 400" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="547.5" y="332" width="125" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="610" y="346" class="edge-label">Assign Daily Tasks</text>
  

    <!-- 4. Staff: Execute Operations -->
    <rect x="600" y="400" width="200" height="60" rx="6" ry="6" stroke="#000000" stroke-width="1.2" fill="#ffffff" />
    <text x="700" y="425" class="act-title">4. Execute Operations &amp; Sign</text>
    <text x="700" y="443" class="act-desc">(Staff Desk Terminal Portal)</text>

    <!-- End -->
    <circle cx="700" cy="530" r="13" stroke="#000000" stroke-width="1.5" fill="#ffffff" />
    <circle cx="700" cy="530" r="7" fill="#000000" />
    <path d="M 700 460 L 700 517" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
    
    <rect x="652.5" y="475" width="95" height="20" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="3" ry="3" />
    <text x="700" y="489" class="edge-label">Shift Logged</text>
  
  
  <!-- Figure Caption -->
  <text x="420" y="635" class="caption">Swimlane 5: Flow_5_Facility_Layout_And_Staff_Scheduling</text>
</svg>