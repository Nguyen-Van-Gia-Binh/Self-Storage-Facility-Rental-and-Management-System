<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Squircle with Brand Color -->
  <rect width="64" height="64" rx="16" fill="#008B74"/>
  
  <!-- 3 Isometric Storage Cubes / Boxes (SmartStorage Brand Mark) -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Box (Center-Top) -->
    <!-- Top face -->
    <path d="M32 14L40 18.5L32 23L24 18.5Z" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Left face -->
    <path d="M24 18.5V27.5L32 32V23Z" fill="#ffffff" fill-opacity="0.1"/>
    <!-- Right face -->
    <path d="M40 18.5V27.5L32 32V23Z" fill="#ffffff" fill-opacity="0.2"/>
    
    <!-- Bottom Left Box -->
    <!-- Top face -->
    <path d="M20 28L28 32.5L20 37L12 32.5Z" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Left face -->
    <path d="M12 32.5V41.5L20 46V37Z" fill="#ffffff" fill-opacity="0.1"/>
    <!-- Right face -->
    <path d="M28 32.5V41.5L20 46V37Z" fill="#ffffff" fill-opacity="0.2"/>

    <!-- Bottom Right Box -->
    <!-- Top face -->
    <path d="M44 28L52 32.5L44 37L36 32.5Z" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Left face -->
    <path d="M36 32.5V41.5L44 46V37Z" fill="#ffffff" fill-opacity="0.1"/>
    <!-- Right face -->
    <path d="M52 32.5V41.5L44 46V37Z" fill="#ffffff" fill-opacity="0.2"/>
  </g>
</svg>